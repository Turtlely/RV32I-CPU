<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RV32I Pipeline Trace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;color:#222;font:13px Arial,sans-serif}header{padding:9px 12px;background:#444;color:#fff;font-weight:bold}.bar,footer{padding:7px;background:#eee;border-bottom:1px solid #aaa}button,input,select{font:inherit;padding:3px 7px}button{border:1px solid #999;background:#eee}main{display:grid;grid-template-columns:minmax(650px,3fr) minmax(370px,2fr);gap:8px;padding:8px}section{margin-bottom:8px;border:1px solid #aaa;background:#f8f8f8}h2{margin:0;padding:5px 7px;background:#e5e5e5;border-bottom:1px solid #aaa;font-size:13px}.pipeline{display:grid;grid-template-columns:repeat(5,1fr)}.stage{min-height:92px;padding:7px;border-right:1px solid #bbb;font:12px/1.5 Consolas,monospace;position:relative}.stage:last-child{border:0}.stage b{font-family:Arial,sans-serif}.stage:not(:last-child)::after{content:'\2192';position:absolute;right:-12px;top:37px;z-index:2;width:23px;text-align:center;background:#eee;border:1px solid #bbb;color:#555;font:16px Consolas,monospace}.active{border-top:3px solid #555}.bubble{color:#888}.controls{display:flex;gap:20px;padding:7px;font-family:Consolas,monospace;border-top:1px solid #bbb}.on{color:#a00000;font-weight:bold}.details{display:grid;grid-template-columns:repeat(4,1fr)}.field,.reg{padding:4px 6px;border-right:1px solid #ccc;border-bottom:1px solid #ddd;font-family:Consolas,monospace}.field small{display:block;color:#666;font-family:Arial,sans-serif}.registers{display:grid;grid-template-columns:repeat(4,1fr)}.changed{background:#fff0a0;font-weight:bold}.memtools{padding:6px;border-bottom:1px solid #ccc}pre{height:230px;margin:0;padding:7px;overflow:auto;background:#fff;font:12px/1.5 Consolas,monospace}.history{height:calc(100vh - 100px);overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;padding:5px;background:#e5e5e5;border-bottom:1px solid #999;text-align:left}td{padding:4px;border-bottom:1px solid #ddd;white-space:nowrap;font-family:Consolas,monospace}tr.selected{background:#cbdcf0}tr:hover{background:#eee}footer{border-top:1px solid #aaa;border-bottom:0}@media(max-width:1050px){main{grid-template-columns:1fr}.history{height:400px}}
</style></head><body><header>RV32I Pipeline Trace</header><div class="bar"><button id="open">Open trace</button><input id="file" type="file" accept=".csv" hidden> <button id="prev" disabled>Previous</button> <button id="next" disabled>Next</button> Cycle <input id="cycle" type="number" min="1" value="1" disabled style="width:70px"> — open sim/program_trace.csv; use arrow keys to step</div>
<main><div><section><h2>Pipeline</h2><div id="pipeline" class="pipeline"></div><div id="controls" class="controls"></div></section><section><h2>EX-stage datapath</h2><div id="details" class="details"></div></section><section><h2>Registers (changed values highlighted)</h2><div id="registers" class="registers"></div></section><section><h2>Data memory</h2><div class="memtools">Address <input id="addr" value="000" style="width:70px"> Bytes <select id="length"><option>32</option><option selected>64</option><option>128</option><option>256</option><option>512</option><option>1024</option></select> <button id="go">Show</button></div><pre id="memory">No trace loaded.</pre></section></div><section><h2>Cycles</h2><div class="history"><table><thead><tr><th>Cycle</th><th>IF</th><th>ID</th><th>EX</th><th>MEM</th><th>WB</th><th>Event</th></tr></thead><tbody id="history"></tbody></table></div></section></main><footer id="status">No trace loaded.</footer>
<script>(()=>{let rows=[],col={},at=0;const E=x=>document.getElementById(x),V=(r,n)=>r[col[n]]??'',N=x=>parseInt(x||'0',16)>>>0,H=(x,w=8)=>(x>>>0).toString(16).toUpperCase().padStart(w,'0'),S=(x,b)=>x>=2**(b-1)?x-2**b:x;
function dec(s){const x=N(s),o=x&127,d=x>>>7&31,f=x>>>12&7,a=x>>>15&31,b=x>>>20&31,g=x>>>25&127,i=x>>20,R={'0,0':'add','0,32':'sub','1,0':'sll','2,0':'slt','3,0':'sltu','4,0':'xor','5,0':'srl','5,32':'sra','6,0':'or','7,0':'and'},I={0:'addi',2:'slti',3:'sltiu',4:'xori',6:'ori',7:'andi'},L={0:'lb',1:'lh',2:'lw',4:'lbu',5:'lhu'},T={0:'sb',1:'sh',2:'sw'},B={0:'beq',1:'bne',4:'blt',5:'bge',6:'bltu',7:'bgeu'};if(o===0x33)return`${R[`${f},${g}`]||'illegal'} x${d},x${a},x${b}`;if(o===0x13)return f===1?`slli x${d},x${a},${b}`:f===5?`${g===32?'srai':'srli'} x${d},x${a},${b}`:`${I[f]||'illegal'} x${d},x${a},${i}`;if(o===3)return`${L[f]||'illegal'} x${d},${i}(x${a})`;const si=S((((x>>>25)<<5)|(x>>>7&31))&4095,12);if(o===0x23)return`${T[f]||'illegal'} x${b},${si}(x${a})`;if(o===0x63)return`${B[f]||'illegal'} x${a},x${b}`;if(o===0x37)return`lui x${d},0x${H(x>>>12,5)}`;if(o===0x17)return`auipc x${d},0x${H(x>>>12,5)}`;if(o===0x6f)return`jal x${d}`;if(o===0x67)return`jalr x${d},${i}(x${a})`;return x===0x13?'nop':`unknown ${H(x)}`}
function stage(r,n,always=false){const ok=always||V(r,n+'_valid')==='1',p=V(r,n+'_pc'),i=V(r,n+'_instr');return`<div class="stage ${ok?'active':'bubble'}"><b>${n.toUpperCase()}</b><br>${ok?`PC ${p}<br>${i}<br>${dec(i)}`:'bubble'}</div>`}function field(k,v){return`<div class="field"><small>${k}</small>${v}</div>`}function evt(r){let x=[];if(V(r,'stall')==='1')x.push('STALL');if(V(r,'flush')==='1')x.push('FLUSH');if(V(r,'take_branch')==='1')x.push('BRANCH');if(V(r,'jump')==='1')x.push('JUMP');if(V(r,'wb_commit_write')==='1'&&V(r,'wb_commit_rd')!=='0')x.push(`x${V(r,'wb_commit_rd')}←${V(r,'wb_commit_data')}`);if(V(r,'mem_commit_write')==='1')x.push(`mem[${V(r,'mem_commit_addr')}]←${V(r,'mem_commit_data')}`);return x.join(' ')||'-'}
function memory(){if(!rows.length)return;const r=rows[at],p=at?rows[at-1]:null;let start=parseInt(E('addr').value.replace(/^0x/i,''),16);if(!isFinite(start))start=0;start=Math.max(0,Math.min(1023,start));let end=Math.min(1024,start+Number(E('length').value)),out='';for(let a=start-start%16;a<end;a+=16){out+=H(a,3)+'  ';let ascii='';for(let j=0;j<16;j++){let n=a+j;if(n>=1024){out+='   ';ascii+=' ';continue}let b=V(r,'m'+n),chg=p&&b!==V(p,'m'+n);out+=(chg?'['+b+']':b+' ');let q=N(b);ascii+=q>=32&&q<=126?String.fromCharCode(q):'.'}out+=' |'+ascii+'|\n'}E('memory').textContent=out}
function render(){if(!rows.length)return;const r=rows[at],p=at?rows[at-1]:null;E('pipeline').innerHTML=stage(r,'if',true)+stage(r,'id')+stage(r,'ex')+stage(r,'mem')+stage(r,'wb');E('controls').innerHTML=`<span class="${V(r,'stall')==='1'?'on':''}">stall=${V(r,'stall')}</span><span class="${V(r,'flush')==='1'?'on':''}">flush=${V(r,'flush')}</span><span>next_pc=${V(r,'next_pc')}</span>`;E('details').innerHTML=field('EX rs1',`x${V(r,'rs1')} = ${V(r,'rs1_data')}`)+field('EX rs2',`x${V(r,'rs2')} = ${V(r,'rs2_data')}`)+field('EX rd','x'+V(r,'rd'))+field('EX immediate',V(r,'imm'))+field('EX ALU A',V(r,'alu_a'))+field('EX ALU B',V(r,'alu_b'))+field('EX ALU op',V(r,'alu_op'))+field('EX result',V(r,'alu_result'))+field('MEM read result',V(r,'mem_read_data'))+field('WB commit',V(r,'wb_commit_write')==='1'?`x${V(r,'wb_commit_rd')} = ${V(r,'wb_commit_data')}`:'-')+field('EX branch / taken',V(r,'branch')+' / '+V(r,'take_branch'))+field('EX jump',V(r,'jump'));let z='';for(let i=0;i<32;i++){let x=V(r,'x'+i),c=p&&x!==V(p,'x'+i);z+=`<div class="reg ${c?'changed':''}">x${String(i).padEnd(2)} ${x}</div>`}E('registers').innerHTML=z;memory();E('cycle').value=V(r,'cycle');E('prev').disabled=at===0;E('next').disabled=at===rows.length-1;document.querySelectorAll('#history tr').forEach((x,i)=>x.classList.toggle('selected',i===at));document.querySelector('#history tr.selected')?.scrollIntoView({block:'nearest'});E('status').textContent=`Cycle ${at+1} of ${rows.length}`}
function select(i){at=Math.max(0,Math.min(rows.length-1,i));render()}function load(t,name){let l=t.replace(/\r/g,'').trim().split('\n'),h=l.shift().split(',');col=Object.fromEntries(h.map((x,i)=>[x,i]));for(const k of['cycle','if_pc','id_instr','ex_instr','mem_instr','wb_instr','x31','m1023'])if(!(k in col))throw Error('Missing pipeline trace column: '+k);rows=l.filter(Boolean).map(x=>x.split(','));E('history').innerHTML=rows.map((r,i)=>`<tr data-i="${i}"><td>${V(r,'cycle')}</td><td>${dec(V(r,'if_instr'))}</td><td>${V(r,'id_valid')==='1'?dec(V(r,'id_instr')):'-'}</td><td>${V(r,'ex_valid')==='1'?dec(V(r,'ex_instr')):'-'}</td><td>${V(r,'mem_valid')==='1'?dec(V(r,'mem_instr')):'-'}</td><td>${V(r,'wb_valid')==='1'?dec(V(r,'wb_instr')):'-'}</td><td>${evt(r)}</td></tr>`).join('');document.querySelectorAll('#history tr').forEach(x=>x.onclick=()=>select(+x.dataset.i));E('cycle').disabled=false;E('status').textContent=`${name}: ${rows.length} cycles`;select(0)}
E('open').onclick=()=>E('file').click();E('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{load(r.result,f.name)}catch(x){alert(x.message)}};r.readAsText(f)};E('prev').onclick=()=>select(at-1);E('next').onclick=()=>select(at+1);E('cycle').onchange=()=>select(+E('cycle').value-1);E('go').onclick=memory;E('length').onchange=memory;document.onkeydown=e=>{if(e.target.matches('input'))return;if(e.key==='ArrowLeft')select(at-1);if(e.key==='ArrowRight')select(at+1)}})();</script></body></html>
